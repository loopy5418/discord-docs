      - Basics:
          - The bot: guide/bot.md
          - The context: guide/context.md
          - Responding: guide/responding.md
          - Message content: guide/messages.md
      - Commands:
          - Slash commands: guide/slash-commands.md
          - Options: guide/options.md
          - Autocomplete: guide/autocomplete.md
          - Subcommands: guide/subcommands.md
          - Prefix commands: guide/prefix-commands.md
          - Context menu commands: guide/context-menus.md
          - Registering and syncing: guide/syncing.md
          - User-installed apps: guide/user-installs.md
      - Interactivity:
          - Components: guide/components.md
          - Component handlers: guide/component-handlers.md
          - Modals: guide/modals.md
          - Waiting for input: guide/waiting.md
      - Running a bot:
          - Events: guide/events.md
          - Intents: guide/intents.md
          - Checks, permissions and cooldowns: guide/checks.md
          - Middleware and errors: guide/middleware.md
          - Loading from files: guide/loading.md
          - The cache: guide/cache.md
