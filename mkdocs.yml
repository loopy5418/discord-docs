      - Context: reference/context.md
      - Definitions: reference/definitions.md
      - Message input: reference/message-input.md
      - ui (components): reference/ui.md
      - api (endpoints): reference/api.md
      - Rest: reference/rest.md
      - permissions: reference/permissions.md
      - fmt (formatting): reference/format.md
      - enums: reference/enums.md
      - intents: reference/intents.md
      - Cache: reference/cache.md
      - Gateway: reference/gateway.md
      - Types: reference/types.md
  - Examples:
